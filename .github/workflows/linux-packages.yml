name: Build and test Ubuntu packages

on:
  workflow_dispatch:
  push:
    branches: ["agent/bundled-ubuntu-packages"]

jobs:
  package:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git python3 python3-venv python3-pip build-essential patchelf dpkg-dev \
            ffmpeg libhackrf0 libusb-1.0-0 libportaudio2 libgl1 libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/checkout@v4
      - name: Build bundled package
        run: bash packaging/build_linux_bundle.sh 26.04 1.0.2
      - name: Install package
        run: apt-get install -y ./linux-dist/hackmstereo_1.0.2-ubuntu26.04_amd64.deb
      - name: Smoke-test imports and GUI startup
        run: |
          test -x /opt/hackmstereo/hAckMstereo
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 /opt/hackmstereo/hAckMstereo
          code=$?
          set -e
          test "$code" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: hackmstereo-ubuntu-26.04
          path: linux-dist/*.deb
          if-no-files-found: error
